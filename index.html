<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Secure Reader</title>
<meta name="theme-color" content="#070b16">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow g1"></div>
<div class="bg-glow g2"></div>

<!-- HOME VIEW -->
<div id="homeView" class="view">
  <header class="topbar glass">
    <div class="brand"><span class="logo-dot"></span>Secure Reader</div>
    <div class="topbar-note">Digital Module Reader</div>
  </header>
  <main class="home-main">
    <section class="hero glass" id="heroCard">
      <div class="hero-skeleton sk-img"></div>
      <div class="hero-info">
        <div class="sk sk-line w60"></div>
        <div class="sk sk-line w40"></div>
        <div class="hero-badges"><span class="sk sk-chip"></span><span class="sk sk-chip"></span><span class="sk sk-chip"></span></div>
      </div>
    </section>
    <div class="section-head"><h2>Chapters</h2><span class="section-count" id="chapterCount"></span></div>
    <section class="chapter-grid" id="chapterGrid"></section>
  </main>
</div>

<!-- READER VIEW -->
<div id="readerView" class="view hidden">
  <header class="reader-top glass">
    <button class="icon-btn" id="backBtn" title="Back">&#8592;</button>
    <div class="reader-title" id="readerTitle">Loading…</div>
    <div class="reader-tools">
      <span class="page-ind" id="pageInd">– / –</span>
      <input class="jump glass-inset" id="jumpInput" type="number" min="1" placeholder="Jump">
      <button class="icon-btn" id="zoomOut" title="Zoom out">&#8722;</button>
      <button class="icon-btn" id="zoomFit" title="Fit width">&#8960;</button>
      <button class="icon-btn" id="zoomIn" title="Zoom in">&#43;</button>
    </div>
  </header>
  <main class="reader-stage" id="readerStage">
    <div class="page-wrap" id="pageWrap">
      <canvas id="pageCanvas"></canvas>
    </div>
    <div class="loader-overlay hidden" id="loader">
      <div class="infinity"><span></span></div>
      <div class="loader-text">Preparing page</div>
    </div>
    <div class="error-overlay hidden" id="errBox">
      <div class="err-card glass">
        <div class="err-icon">!</div>
        <div class="err-title">Page load nahi hui</div>
        <div class="err-msg" id="errMsg"></div>
        <button class="btn primary" id="retryBtn">Retry</button>
      </div>
    </div>
  </main>
  <div class="reader-bottom glass">
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="bottom-nav">
      <button class="btn ghost" id="prevBtn">&#8592; Prev</button>
      <button class="btn ghost" id="nextBtn">Next &#8594;</button>
    </div>
  </div>
</div>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';

/* ---------- recovered pipeline (from the audit) ---------- */
const API = 'https://books.streamfiles.eu.org/api';
const DEFAULT_CHAPTER_ID = '699c11b428569e839bf7e7d9'; // demo chapter: Units and Measurements
const KEY = [90, 165, 195, 60, 15, 240, 150, 105];

const b64ToBytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const decrypt = (u8) => {
  const out = new Uint8Array(u8.length);
  for (let i = 0; i < u8.length; i++) out[i] = u8[i] ^ KEY[i % 8] ^ (i % 256);
  return out;
};

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);

/* ---------- routing ---------- */
if (params.get('ref')) openReader(params);
else initHome();

/* ================= HOME ================= */
async function initHome() {
  const bookId = params.get('book') || DEFAULT_CHAPTER_ID;
  let book = null;
  try {
    const r = await fetch(`${API}/books.php?book_chapters=${encodeURIComponent(bookId)}`);
    const j = await r.json();
    if (j.success && j.data) book = j.data;
  } catch (_) {}
  if (!book) { $('chapterGrid').innerHTML = '<div class="chap">Book list load nahi hui. Reload karke dekho.</div>'; return; }

  // hero
  const cover = book.coverImage && (book.coverImage.fullUrl || (book.coverImage.baseUrl ? book.coverImage.baseUrl + book.coverImage.key : ''));
  const hero = $('heroCard');
  hero.innerHTML = '';
  if (cover) { const img = new Image(); img.src = cover; img.className = 'hero-cover'; img.loading = 'lazy'; hero.appendChild(img); }
  const info = document.createElement('div');
  info.className = 'hero-info';
  const badges = [
    book.displayClass && `<span class="badge">${book.displayClass}</span>`,
    (book.exams || []).join(', ') && `<span class="badge">${(book.exams || []).join(', ')}</span>`,
    book.edition && `<span class="badge">${book.edition}</span>`,
  ].filter(Boolean).join('');
  info.innerHTML = `
    <div class="hero-title">${escapeHtml(book.title || 'Digital Module')}</div>
    <div class="hero-sub">${escapeHtml(book.subTitle || book.author || '')} · ${book.noOfChapters || (book.chapterDetails || []).length} chapters</div>
    <div class="hero-badges">${badges}</div>`;
  hero.appendChild(info);

  // chapters
  const chaps = (book.chapterDetails || []).filter((c) => c.status === 'ACTIVE');
  chaps.sort((a, b) => (parseInt(a.displayChapterNumber) || 0) - (parseInt(b.displayChapterNumber) || 0));
  $('chapterCount').textContent = `${chaps.length} chapters`;
  $('chapterGrid').innerHTML = '';
  chaps.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'chap';
    card.innerHTML = `
      <div class="chap-num">${escapeHtml(String(c.displayChapterNumber || i + 1))}</div>
      <div class="chap-title">${escapeHtml(c.title || 'Chapter')}</div>
      <div class="chap-meta">${c.totalPageCount ? c.totalPageCount + ' pages' : ''}</div>`;
    card.onclick = () => {
      const q = new URLSearchParams({ ref: c.encryptedQuery || '', pages: c.totalPageCount || '', title: c.title || 'Chapter' });
      location.href = '?' + q.toString();
    };
    $('chapterGrid').appendChild(card);
  });
}

/* ================= READER ================= */
const R = { ref: '', pages: 0, title: '', cur: 0, zoom: 1, cache: new Map(), busy: false, fit: 0 };

function openReader(params) {
  $('homeView').classList.add('hidden');
  $('readerView').classList.remove('hidden');
  R.ref = params.get('ref') || '';
  R.title = params.get('title') || 'Secure Reader';
  R.pages = parseInt(params.get('pages')) || 0;
  $('readerTitle').textContent = R.title;

  // page count: use param first, verify with API in background
  if (R.pages) { setChrome(1); goTo(1); }
  fetch(`${API}/page_count.php?asset_ref=${encodeURIComponent(R.ref)}`)
    .then((r) => r.json())
    .then((j) => { if (j.success && j.pages) { R.pages = j.pages; if (R.cur) setChrome(R.cur); } })
    .catch(() => {});

  $('backBtn').onclick = () => { location.href = './'; };
  $('prevBtn').onclick = () => goTo(R.cur - 1);
  $('nextBtn').onclick = () => goTo(R.cur + 1);
  $('zoomIn').onclick = () => { R.zoom = Math.min(2, R.zoom + 0.15); if (R.cur) goTo(R.cur); };
  $('zoomOut').onclick = () => { R.zoom = Math.max(0.6, R.zoom - 0.15); if (R.cur) goTo(R.cur); };
  $('zoomFit').onclick = () => { R.zoom = 1; if (R.cur) goTo(R.cur); };
  $('retryBtn').onclick = () => { hide('errBox'); if (R.cur) goTo(R.cur); };
  $('jumpInput').onkeydown = (e) => {
    if (e.key === 'Enter') {
      const n = parseInt($('jumpInput').value);
      if (n >= 1 && n <= R.pages) { goTo(n); $('jumpInput').blur(); }
    }
  };
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') goTo(R.cur + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') goTo(R.cur - 1);
  });
  window.addEventListener('resize', () => { if (!R.busy && R.cur) goTo(R.cur); });
}

function hide(id) { $(id).classList.add('hidden'); }
function show(id) { $(id).classList.remove('hidden'); }

function setChrome(n) {
  $('pageInd').textContent = `${n} / ${R.pages || '–'}`;
  $('progressFill').style.width = R.pages ? `${(n / R.pages) * 100}%` : '0%';
}

async function goTo(n) {
  if (!R.pages || n < 1 || n > R.pages || R.busy) return;
  R.busy = true;
  R.cur = n;
  setChrome(n);
  $('jumpInput').value = n;
  show('loader'); hide('errBox');
  try {
    const doc = await getPageDoc(n);
    const canvas = $('pageCanvas');
    const wrap = $('pageWrap');
    const avail = Math.min($('readerStage').clientWidth - 24, 860);
    const base = doc.getPage(1).then ? null : null;
    const page1 = await doc.getPage(1);
    const vp1 = page1.getViewport({ scale: 1 });
    let scale = (avail / vp1.width) * R.zoom;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vp = page1.getViewport({ scale: scale * dpr });
    canvas.width = vp.width; canvas.height = vp.height;
    canvas.style.width = `${avail * R.zoom}px`;
    wrap.style.width = `${avail * R.zoom}px`;
    await page1.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    hide('loader');
    // preload next two pages silently
    if (n + 1 <= R.pages) getPageDoc(n + 1).catch(() => {});
    if (n + 2 <= R.pages) getPageDoc(n + 2).catch(() => {});
  } catch (err) {
    hide('loader'); show('errBox');
    $('errMsg').textContent = (err && err.message) || 'Unknown error';
  }
  R.busy = false;
}

async function getPageDoc(n) {
  if (R.cache.has(n)) return R.cache.get(n);
  const p = (async () => {
    const r = await fetch(`${API}/page.php?asset_ref=${encodeURIComponent(R.ref)}&page=${n}`);
    const j = await r.json();
    if (!j.success || !j.data) throw new Error(j.error || 'Failed to load page');
    const bytes = decrypt(b64ToBytes(j.data));
    const doc = await pdfjsLib.getDocument({ data: bytes, isEvalSupported: false }).promise;
    return doc;
  })();
  R.cache.set(n, p);
  p.catch(() => R.cache.delete(n));
  return p;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

</script>
</body>
</html>
